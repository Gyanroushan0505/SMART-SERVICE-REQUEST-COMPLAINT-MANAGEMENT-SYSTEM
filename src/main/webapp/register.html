<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Smart Complaint</title>
    <link rel="stylesheet" href="style.css?v=20261110-registration">
</head>
<body class="register-page">
    <main class="register-shell">
        <section class="register-brand">
            <div class="register-brand-mark">SC</div>
            <p class="register-eyebrow">SMART CAMPUS</p>
            <h1>Smart Complaint<br>Management System</h1>
            <p class="register-brand-copy">Create your student account to submit hostel complaints and track their progress.</p>
            <div class="register-trust"><span>✓</span> Secure student registration</div>
        </section>

        <section class="register-panel">
            <div class="register-heading">
                <span class="register-step">STUDENT PORTAL</span>
                <h2>Create your account</h2>
                <p>Enter the details below to get started.</p>
            </div>

            <form id="registerForm" class="register-form">
                <div class="register-field">
                    <label for="regName">Full Name</label>
                    <input id="regName" name="name" type="text" required maxlength="100" autocomplete="name" placeholder="Enter your full name">
                </div>

                <div class="register-field">
                    <label for="regStudentId">Student ID</label>
                    <input id="regStudentId" name="studentId" type="text" required autocomplete="username" placeholder="Enter your student ID">
                </div>

                <div class="register-field">
                    <label for="regEmail">Email</label>
                    <input id="regEmail" name="email" type="email" required autocomplete="email" placeholder="name@example.com">
                </div>

                <div class="register-field">
                    <label for="regPassword">Password <span>Minimum 8 characters</span></label>
                    <div class="register-password">
                        <input id="regPassword" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Create a password">
                        <button type="button" id="toggleRegPassword" aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="register-field">
                    <label for="regFloor">Floor</label>
                    <select id="regFloor" name="floor" required>
                        <option value="">Select floor</option>
                        <option value="Ground Floor">Ground Floor</option>
                        <option value="1st Floor">1st Floor</option>
                        <option value="2nd Floor">2nd Floor</option>
                        <option value="3rd Floor">3rd Floor</option>
                    </select>
                </div>

                <div class="register-field">
                    <label for="regRoom">Room Number</label>
                    <input id="regRoom" name="roomNumber" type="text" placeholder="Enter room number">
                </div>

                <button class="register-submit" type="submit">Create Student Account <span>→</span></button>
                <p id="formMessage" class="register-message" role="status" aria-live="polite"></p>
            </form>

            <p class="register-login">Already registered? <a href="html.html">Login here</a></p>
        </section>
    </main>
    <script src="app.js?v=20261110-registration"></script>
    <script>
        const passwordInput = document.getElementById('regPassword');
        const passwordToggle = document.getElementById('toggleRegPassword');
        passwordToggle.addEventListener('click', function () {
            const showPassword = passwordInput.type === 'password';
            passwordInput.type = showPassword ? 'text' : 'password';
            passwordToggle.textContent = showPassword ? 'Hide' : 'Show';
            passwordToggle.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Service Request & Complaint Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Section -->
        <div class="left-section">

            <div class="logo">
                
            </div>

            <h1>Smart Service Request</h1>
            <h2>& Complaint Management System</h2>

            <p>
                Report your hostel problems, track complaints
                and get faster resolutions with ML.
            </p>

            <div class="features">
                <div> Quick Complaint</div>
                <div> Smart Prediction</div>
                <div>Track Status</div>
            </div>

        </div>


        <!-- Right Login Section -->
        <div class="login-section">

            <div class="login-box">

                <h1>Welcome Back!</h1>
                <p class="subtitle">Login to your account</p>

                

                    <!-- User ID -->
                     <form id="loginForm">
                    <label for="userid">Student ID</label>

                    <div class="input-box">
                        <span></span>

                        <input
                            type="text"
                            id="userid"
                            placeholder="Enter Student ID"
                            required
                        >
                    </div>


                    <!-- Password -->
                    <label for="password">Password</label>

                    <div class="input-box">
                        <span></span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="showPassword()">
                            👁️
                        </button>
                    </div>


                    <!-- Remember -->
                    <div class="remember">

                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>


                <p class="register">
                    New User?
                    <a href="#">Create an Account</a>
                </p>

                <div class="ml-text">
                    Powered by Machine Learning
                </div>

            </div>

        </div>

    </div>

    <script src="javascript.js"></script>

</body>
</html>

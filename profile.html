<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Smart Complaint Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            
            <h2>Smart Complaint</h2>
        </div>

        <nav>
            <a href="home.html"> Home</a>

            <a href="submit-complaint.html">
                 Submit Complaint
            </a>

            <a href="my-complaints.html">
                 My Complaints
            </a>

            <a href="complaint-status.html">
                 Complaint Status
            </a>

            <a href="complaint-history.html">
                 Complaint History
            </a>

            <a href="profile.html" class="active">
                 Profile
            </a>

            <a href="html.html">
                 Logout
            </a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="top-header">

            <div>
                <h1>My Profile</h1>
                <p>View your student information</p>
            </div>

            <div class="student-info">
                 Student
            </div>

        </header>


        <!-- Profile Card -->
        <section class="complaint-form">

            <div class="profile-icon">
                
            </div>

            <h2>Student Profile</h2>

            <p>Your registered student information</p>


            <div class="form-group">
                <label>Student ID</label>

                <input
                    type="text"
                    value="STU001"
                    readonly
                >
            </div>


            <div class="form-group">
                <label>Student Name</label>

                <input
                    type="text"
                    value="Student Name"
                    readonly
                >
            </div>


            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    value="student@example.com"
                    readonly
                >
            </div>


            <div class="form-group">
                <label>Floor</label>

                <input
                    type="text"
                    value="2nd Floor"
                    readonly
                >
            </div>


            <div class="form-group">
                <label>Room Number</label>

                <input
                    type="text"
                    value="205"
                    readonly
                >
            </div>


            <button class="submit-btn" type="button">
                 Edit Profile
            </button>

        </section>

    </main>

</body>

</html>
